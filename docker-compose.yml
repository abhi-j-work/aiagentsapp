version: '3.8'

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    user: "0:0"
    ports:
      - "5000:5000"
    volumes:
      - mlruns_data:/mlruns
    command: >
      sh -c "chmod -R 777 /mlruns && \
             mlflow server \
             --host 0.0.0.0 \
             --port 5000 \
             --backend-store-uri sqlite:///mlruns/mlflow.db \
             --default-artifact-root /mlruns"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080" # Access Adminer at http://localhost:8080

# Declaration of all named volumes used by the services
volumes:
  mlruns_data:
  postgres_data: